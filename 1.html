<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>飲食計畫 App（HTML 可執行版）</title>
  <style>
    :root{--bg:#f6f8fb;--card:#fff;--primary:#2563eb;--muted:#6b7280}
    html,body{height:100%;margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,'Noto Sans TC',Arial}
    body{background:linear-gradient(180deg,#eef2ff 0%,var(--bg) 50%);padding:20px}
    .app{max-width:1000px;margin:12px auto}
    header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
    h1{margin:0;font-size:20px}
    .card{background:var(--card);border-radius:12px;padding:16px;box-shadow:0 6px 18px rgba(15,23,42,0.06);margin-bottom:12px}
    .grid{display:grid;gap:12px}
    .cols-3{grid-template-columns:1fr 1fr 1fr}
    label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
    input,select{width:100%;padding:8px 10px;border:1px solid #e6edf3;border-radius:8px;font-size:14px}
    button{background:var(--primary);color:#fff;border:0;padding:10px 14px;border-radius:10px;cursor:pointer}
    .small-btn{padding:6px 8px;font-size:13px}
    .muted{color:var(--muted);font-size:13px}
    .row{display:flex;gap:8px}
    .meals{display:flex;flex-direction:column;gap:8px}
    .meal{display:flex;justify-content:space-between;align-items:center;padding:10px;border-radius:8px;border:1px dashed #e6edf3}
    .recipe{font-size:14px}
    .macro{font-weight:600}
    footer{margin-top:18px;text-align:center;color:var(--muted);font-size:13px}
    .hidden{display:none}
    .pill{background:#f3f4f6;padding:6px 8px;border-radius:999px;font-size:13px}
    .flex{display:flex;gap:10px;align-items:center}
    .shopping-list{list-style:none;padding-left:0;margin:0}
    .shopping-list li{padding:6px 0;border-bottom:1px solid #f1f5f9}
    .topline{display:flex;gap:8px;align-items:center}
    .cta{display:flex;gap:8px}
    .export{background:#10b981}
    @media (max-width:820px){.cols-3{grid-template-columns:1fr}header{flex-direction:column;align-items:flex-start;gap:8px}}
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>飲食計畫 App — HTML 可執行版</h1>
      <div class="topline">
        <div id="welcome" class="muted">未設定使用者</div>
        <div class="cta">
          <button id="openOnboard" class="small-btn">設定/修改個人資料</button>
          <button id="exportBtn" class="small-btn export">匯出計畫</button>
        </div>
      </div>
    </header>

    <section id="onboarding" class="card">
      <h3>快速設定（Onboarding）</h3>
      <div class="grid cols-3" style="margin-top:12px">
        <div>
          <label>姓名</label>
          <input id="name" placeholder="例如：小明">
        </div>
        <div>
          <label>年齡</label>
          <input id="age" type="number" min="10" max="120" placeholder="歲">
        </div>
        <div>
          <label>性別</label>
          <select id="gender"><option value="male">男</option><option value="female">女</option><option value="other">其他</option></select>
        </div>
        <div>
          <label>身高（cm）</label>
          <input id="height" type="number" min="100" max="250">
        </div>
        <div>
          <label>體重（kg）</label>
          <input id="weight" type="number" min="30" max="300">
        </div>
        <div>
          <label>活動量</label>
          <select id="activity"><option value="1.2">久坐 (少運動)</option><option value="1.375">輕度活動</option><option value="1.55">中度活動</option><option value="1.725">高度活動</option></select>
        </div>
        <div>
          <label>目標</label>
          <select id="goal"><option value="maintain">維持體重</option><option value="lose">減重（輕）</option><option value="lose_fast">減重（較積極）</option><option value="gain">增重/增肌</option></select>
        </div>
        <div>
          <label>飲食偏好</label>
          <select id="diet"><option value="omnivore">一般（肉食）</option><option value="vegetarian">素食</option><option value="vegan">全素</option><option value="pescatarian">海鮮素</option></select>
        </div>
        <div>
          <label>食物過敏（逗號分隔）</label>
          <input id="allergies" placeholder="例如：牛奶, 堅果">
        </div>
      </div>
      <div style="margin-top:12px" class="row">
        <button id="saveProfile">儲存並生成今日計畫</button>
        <button id="clearData" class="small-btn">清除資料</button>
      </div>
      <div id="profileSummary" class="muted" style="margin-top:8px"></div>
    </section>

    <section id="today" class="card">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div>
          <h3>今日總覽</h3>
          <div id="calSummary" class="muted">請先設定個人資料以產生計畫。</div>
        </div>
        <div class="flex">
          <div class="pill" id="calTarget">-- kcal</div>
          <div class="pill" id="macroTarget">P- - /F- - /C- -</div>
        </div>
      </div>
      <div style="margin-top:12px">
        <div class="meals" id="mealsContainer"></div>
      </div>
    </section>

    <section class="card">
      <h3>購物清單（由本週菜單產生）</h3>
      <ul id="shoppingList" class="shopping-list"></ul>
      <div style="margin-top:8px" class="row">
        <button id="generateShopping">產生購物清單</button>
        <button id="downloadShopping" class="small-btn">下載清單</button>
      </div>
    </section>

    <section id="analytics" class="card hidden">
      <h3>追蹤（示範）</h3>
      <div class="muted">功能範例：體重記錄、熱量趨勢等，可擴充到圖表與匯出。</div>
    </section>

    <footer>
      這是一個單檔離線 HTML 原型，資料儲存在瀏覽器 localStorage。可作為示範與二次開發基礎。
    </footer>
  </div>

  <script>
    // --- 範例食譜資料庫（簡化）
    const RECIPES = [
      {id:1,name:'和風雞胸沙拉',cal:350,protein:35,fat:12,carbs:30,ingredients:[['雞胸肉',200],['生菜',100],['小番茄',50]] ,tags:['omnivore']},
      {id:2,name:'蒜香烤鮭魚',cal:420,protein:38,fat:26,carbs:6,ingredients:[['鮭魚',180],['檸檬',20],['綠花椰',100]],tags:['pescatarian','omnivore']},
      {id:3,name:'豆腐味噌湯定食',cal:450,protein:22,fat:18,carbs:45,ingredients:[['豆腐',150],['味噌',20],['白飯',150]],tags:['vegetarian','vegan','omnivore']},
      {id:4,name:'牛肉燴飯（小份）',cal:580,protein:40,fat:22,carbs:60,ingredients:[['牛肉',150],['洋蔥',50],['白飯',180]],tags:['omnivore']},
      {id:5,name:'鷹嘴豆蔬菜咖哩',cal:520,protein:18,fat:20,carbs:60,ingredients:[['鷹嘴豆',150],['馬鈴薯',120],['咖哩醬',50]],tags:['vegan','vegetarian']},
      {id:6,name:'蛋白燕麥（早餐）',cal:320,protein:25,fat:8,carbs:38,ingredients:[['燕麥',60],['牛奶/替代品',200],['蛋白粉',30]],tags:['omnivore','vegetarian']},
      {id:7,name:'青醬義大利麵（小份）',cal:640,protein:20,fat:24,carbs:80,ingredients:[['義大利麵',180],['青醬',40],['松子/替代',10]],tags:['vegetarian']}
    ];

    const dom = id => document.getElementById(id);

    // load/save profile
    function loadProfile(){
      const p = JSON.parse(localStorage.getItem('profile')||'null');
      if(!p) return null;
      ['name','age','gender','height','weight','activity','goal','diet','allergies'].forEach(k=>{
        if(dom(k)) dom(k).value = p[k] ?? '';
      });
      updateWelcome(p.name);
      return p;
    }
    function saveProfileFromInputs(){
      const profile = {
        name:dom('name').value||'使用者',
        age:parseInt(dom('age').value)||30,
        gender:dom('gender').value||'male',
        height:parseFloat(dom('height').value)||170,
        weight:parseFloat(dom('weight').value)||70,
        activity:parseFloat(dom('activity').value)||1.375,
        goal:dom('goal').value||'maintain',
        diet:dom('diet').value||'omnivore',
        allergies: dom('allergies').value ? dom('allergies').value.split(',').map(s=>s.trim().toLowerCase()) : []
      };
      localStorage.setItem('profile',JSON.stringify(profile));
      updateWelcome(profile.name);
      return profile;
    }

    function updateWelcome(name){ dom('welcome').textContent = name + '，您好'; }

    // --- BMR & calorie target (Mifflin-St Jeor)
    function calcBMR(p){
      // BMR in kcal/day
      if(p.gender === 'male'){
        return 10*p.weight + 6.25*p.height - 5*p.age + 5;
      } else if(p.gender === 'female'){
        return 10*p.weight + 6.25*p.height - 5*p.age -161;
      } else {
        return 10*p.weight + 6.25*p.height - 5*p.age; // neutral
      }
    }
    function dailyTargetCalories(profile){
      const bmr = calcBMR(profile);
      let maintenance = Math.round(bmr * profile.activity);
      let target = maintenance;
      if(profile.goal === 'lose') target = Math.round(maintenance - 400);
      if(profile.goal === 'lose_fast') target = Math.round(maintenance - 650);
      if(profile.goal === 'gain') target = Math.round(maintenance + 400);
      return {bmr,maintenance,target};
    }

    function macrosFromCalories(cal,targetMode){
      // returns approximate grams P/F/C based on chosen split
      // default splits: maintain/lose/gain
      let split = {p:0.3,f:0.3,c:0.4};
      if(targetMode==='gain') split = {p:0.35,f:0.25,c:0.4};
      if(targetMode==='lose' || targetMode==='lose_fast') split = {p:0.35,f:0.3,c:0.35};
      const p_kcal = Math.round(cal*split.p);
      const f_kcal = Math.round(cal*split.f);
      const c_kcal = Math.round(cal*split.c);
      return {protein_g:Math.round(p_kcal/4),fat_g:Math.round(f_kcal/9),carb_g:Math.round(c_kcal/4)};
    }

    // --- Meal planning (very simplified)
    function generateDailyPlan(profile){
      const {target} = dailyTargetCalories(profile);
      const macros = macrosFromCalories(target, profile.goal);
      // choose 3 meals + snack
      const candidates = RECIPES.filter(r=>{
        // filter by diet
        if(profile.diet==='vegan' && !r.tags.includes('vegan')) return false;
        if(profile.diet==='vegetarian' && !r.tags.includes('vegetarian') && !r.tags.includes('vegan')) return false;
        if(profile.diet==='pescatarian' && !r.tags.includes('pescatarian') && !r.tags.includes('vegan') && !r.tags.includes('vegetarian')) return false;
        if(profile.diet==='omnivore') return true;
        // allergies filter
        const low = (r.ingredients||[]).map(i=>i[0].toString().toLowerCase());
        for(const a of profile.allergies){ if(!a) continue; if(low.some(x=>x.includes(a))) return false; }
        return true;
      });
      // simple greedy pack to reach target
      const plan = [];
      let remaining = target;
      // breakfast: pick a lighter
      const breakfast = candidates.find(r=>r.cal<=360) || candidates[0];
      plan.push({meal:'早餐',recipe:breakfast}); remaining -= breakfast.cal;
      // lunch
      const lunch = candidates.find(r=>r.cal>350 && r.cal<=600) || candidates[1] || breakfast;
      plan.push({meal:'午餐',recipe:lunch}); remaining -= lunch.cal;
      // dinner
      const dinner = candidates.slice().reverse().find(r=>r.cal>350) || candidates[0];
      plan.push({meal:'晚餐',recipe:dinner}); remaining -= dinner.cal;
      // snack to fill
      const snack = candidates.find(r=>r.cal<=350 && r!==breakfast) || breakfast;
      // if remaining > 200, add snack
      if(remaining > 180) plan.push({meal:'點心',recipe:snack});

      // compute totals
      const totals = plan.reduce((acc,p)=>{acc.cal += p.recipe.cal; acc.protein += p.recipe.protein; acc.fat+=p.recipe.fat; acc.carbs+=p.recipe.carbs; return acc},{cal:0,protein:0,fat:0,carbs:0});
      return {plan,totals,calTarget:target,macros};
    }

    // --- UI rendering
    function renderProfileSummary(p){
      dom('profileSummary').textContent = `已設定：${p.name}，${p.age}歲，${p.height}cm，${p.weight}kg，目標：${p.goal}`;
    }

    function renderToday(planObj){
      dom('calTarget').textContent = planObj.calTarget + ' kcal';
      dom('macroTarget').textContent = `P-${planObj.macros.protein_g}g / F-${planObj.macros.fat_g}g / C-${planObj.macros.carb_g}g`;
      dom('calSummary').textContent = `今日計畫熱量 (估)： ${planObj.totals.cal} kcal，建議： ${planObj.calTarget} kcal`;
      const container = dom('mealsContainer'); container.innerHTML = '';
      planObj.plan.forEach(item=>{
        const div = document.createElement('div'); div.className='meal';
        const left = document.createElement('div'); left.innerHTML = `<div class="recipe">${item.meal} — <strong>${item.recipe.name}</strong></div><div class="muted">${item.recipe.cal} kcal | P ${item.recipe.protein}g • F ${item.recipe.fat}g • C ${item.recipe.carbs}g</div>`;
        const right = document.createElement('div');
        const showBtn = document.createElement('button'); showBtn.className='small-btn'; showBtn.textContent='檢視食譜';
        showBtn.onclick = ()=>{ alert(`${item.recipe.name}\n\n熱量: ${item.recipe.cal} kcal\n蛋白: ${item.recipe.protein} g\n脂肪: ${item.recipe.fat} g\n碳水: ${item.recipe.carbs} g\n\n食材:\n${item.recipe.ingredients.map(x=>'- '+x[0]+': '+x[1]+(x[1]?'g':'' )).join('\n')}\n\n步驟:\n示範做法：將主食材烹調、調味即成（此原型僅示範）`); };
        const swapBtn = document.createElement('button'); swapBtn.className='small-btn'; swapBtn.textContent='替換';
        swapBtn.onclick = ()=>{ replaceRecipe(item, planObj); };
        right.appendChild(showBtn); right.appendChild(swapBtn);
        div.appendChild(left); div.appendChild(right);
        container.appendChild(div);
      });

      // save today's plan
      localStorage.setItem('todayPlan', JSON.stringify(planObj));
    }

    function replaceRecipe(item, planObj){
      // choose replacement with similar calories
      const same = RECIPES.filter(r=>Math.abs(r.cal - item.recipe.cal) < 150 && r.id !== item.recipe.id);
      if(same.length===0){ alert('找不到合適替換食譜'); return; }
      const newr = same[Math.floor(Math.random()*same.length)];
      item.recipe = newr;
      // recompute totals
      planObj.totals = planObj.plan.reduce((acc,p)=>{acc.cal += p.recipe.cal; acc.protein += p.recipe.protein; acc.fat += p.recipe.fat; acc.carbs += p.recipe.carbs; return acc},{cal:0,protein:0,fat:0,carbs:0});
      renderToday(planObj);
    }

    // --- Shopping list generation (aggregate ingredients)
    function generateShoppingFromPlan(planObj){
      const map = {};
      planObj.plan.forEach(p=>{
        p.recipe.ingredients.forEach(([name,qty])=>{
          const key = name.toLowerCase();
          map[key] = map[key] || {name,qty:0};
          map[key].qty += (typeof qty==='number'?qty:0);
        });
      });
      const list = Object.values(map);
      localStorage.setItem('shoppingList', JSON.stringify(list));
      return list;
    }

    function renderShopping(list){
      const el = dom('shoppingList'); el.innerHTML='';
      if(list.length===0) { el.innerHTML='<li class="muted">尚無項目，請先產生計畫</li>'; return; }
      list.forEach(it=>{ const li = document.createElement('li'); li.textContent = `${it.name} — 約 ${it.qty} g（或視包裝數量調整）`; el.appendChild(li); });
    }

    // --- Events
    dom('saveProfile').addEventListener('click', ()=>{
      const p = saveProfileFromInputs();
      renderProfileSummary(p);
      const plan = generateDailyPlan(p);
      renderToday(plan);
      alert('個人資料已儲存，並為您生成今日飲食計畫。');
    });

    dom('clearData').addEventListener('click', ()=>{
      if(confirm('確定要清除本地所有資料嗎？')){ localStorage.clear(); location.reload(); }
    });

    dom('openOnboard').addEventListener('click', ()=>{ window.scrollTo({top:0,behavior:'smooth'}); dom('name').focus(); });

    dom('generateShopping').addEventListener('click', ()=>{
      const plan = JSON.parse(localStorage.getItem('todayPlan')||'null');
      if(!plan){ alert('尚未生成今日計畫'); return; }
      const list = generateShoppingFromPlan(plan);
      renderShopping(list);
      alert('已依今日計畫產生購物清單（存在 localStorage）');
    });

    dom('downloadShopping').addEventListener('click', ()=>{
      const list = JSON.parse(localStorage.getItem('shoppingList')||'null');
      if(!list){ alert('尚無購物清單，請先產生'); return; }
      const blob = new Blob([JSON.stringify(list,null,2)],{type:'application/json'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href=url; a.download='shopping_list.json'; a.click(); URL.revokeObjectURL(url);
    });

    dom('exportBtn').addEventListener('click', ()=>{
      const data = {profile: JSON.parse(localStorage.getItem('profile')||'null'), todayPlan: JSON.parse(localStorage.getItem('todayPlan')||'null'), shoppingList: JSON.parse(localStorage.getItem('shoppingList')||'null')};
      const blob = new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href=url; a.download='diet_app_export.json'; a.click(); URL.revokeObjectURL(url);
    });

    // --- init
    (function init(){
      const p = loadProfile();
      if(p){ renderProfileSummary(p); const plan = generateDailyPlan(p); renderToday(plan); }
      const shop = JSON.parse(localStorage.getItem('shoppingList')||'null'); if(shop) renderShopping(shop);
    })();
  </script>
</body>
</html>
